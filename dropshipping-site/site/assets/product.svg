<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustration de la brosse massante LED">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#ff6b5b" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff6b5b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e2da"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f1ec"/>
      <stop offset="100%" stop-color="#d9d3c9"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="150" r="170" fill="url(#glow)"/>
  <!-- handle -->
  <rect x="168" y="200" width="64" height="170" rx="32" fill="url(#handle)" stroke="#cfc8bc"/>
  <circle cx="200" cy="270" r="11" fill="#2f4a3f"/>
  <rect x="194" y="300" width="12" height="30" rx="6" fill="#bfb7aa"/>
  <!-- head -->
  <ellipse cx="200" cy="150" rx="120" ry="92" fill="url(#body)" stroke="#cfc8bc" stroke-width="2"/>
  <ellipse cx="200" cy="150" rx="98" ry="72" fill="#f6f3ee"/>
  <!-- serum tank -->
  <rect x="180" y="74" width="40" height="18" rx="9" fill="#cfe3da" stroke="#9fbcaf"/>
  <!-- bristles + LEDs -->
  <g fill="#2f4a3f">
    <circle cx="140" cy="130" r="6"/><circle cx="170" cy="118" r="6"/><circle cx="230" cy="118" r="6"/><circle cx="260" cy="130" r="6"/>
    <circle cx="125" cy="160" r="6"/><circle cx="155" cy="150" r="6"/><circle cx="245" cy="150" r="6"/><circle cx="275" cy="160" r="6"/>
    <circle cx="145" cy="185" r="6"/><circle cx="175" cy="180" r="6"/><circle cx="225" cy="180" r="6"/><circle cx="255" cy="185" r="6"/>
    <circle cx="200" cy="200" r="6"/>
  </g>
  <g fill="#ff5a4a">
    <circle cx="200" cy="125" r="7"/><circle cx="185" cy="155" r="7"/><circle cx="215" cy="155" r="7"/>
    <circle cx="160" cy="205" r="5"/><circle cx="240" cy="205" r="5"/>
  </g>
</svg>
